<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>营养师对话 · 食鉴 AI 营养分析师</title>
  <meta name="description" content="AI 营养师记得你今天的摄入情况，一对一给出贴心的饮食建议。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/scroll.css">
</head>
<body>

  <!-- ============ 顶部导航 ============ -->
  <header class="navbar">
    <div class="container nav-inner">
      <a class="logo" href="home.html">
        <span class="logo-icon">🥗</span>
        <span class="logo-text">食鉴 <em>AI 营养分析师</em></span>
      </a>
      <nav class="nav-links" aria-label="主导航">
        <a href="home.html">首页</a>
        <a href="nutrition.html">AI 营养师</a>
        <a href="chat.html" aria-current="page">营养师对话</a>
        <a href="tracker.html">今日摄入</a>
        <a href="exercise.html">运动中心</a>
      </nav>
      <div class="nav-user" id="nav-user"></div>
    </div>
  </header>

  <!-- ============ 独立吸附滚动容器 ============ -->
  <main class="page-scroll" id="pageScroll">

    <!-- 区块1：标题 Banner -->
    <section class="snap-block" data-block-name="对话页首页">
      <div class="chat-banner">
        <img class="banner-deco" src="image/veggies.jpg" alt="" decoding="async">
        <h1>营养师对话</h1>
        <p>结合今天的摄入记录，聊聊热量预算和下一餐怎么吃。</p>
      </div>
    </section>

    <!-- 区块2：聊天消息区 -->
    <section class="snap-block" data-block-name="聊天消息">
      <div class="container">
        <div class="chat-window">
          <div class="chat-messages" id="chat-messages" role="log" aria-label="聊天记录">
            <div class="msg msg-ai">你好，我是你的 AI 营养师。想聊聊今天吃了什么，还是一起安排下一餐？</div>
          </div>
          <div class="chat-input-row">
            <input type="text" id="chat-input" aria-label="向营养师提问" placeholder="输入你的问题…" maxlength="300">
            <button class="btn btn-primary" id="chat-send">发送</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 区块3：快捷话术 -->
    <section class="snap-block chat-suggestions" data-block-name="快捷提问">
      <div class="container">
        <h2 class="section-title">快捷提问</h2>
        <div class="quick-grid">
          <button class="chat-quick" data-q="今天还剩多少热量预算？"><img class="mini-thumb" src="image/hero-salad.jpg" alt="" loading="lazy" decoding="async">今天还剩多少热量预算？</button>
          <button class="chat-quick" data-q="晚上健身前吃什么？"><img class="mini-thumb" src="image/chicken-meal.jpg" alt="" loading="lazy" decoding="async">晚上健身前吃什么？</button>
          <button class="chat-quick" data-q="我这样吃营养均衡吗？"><img class="mini-thumb" src="image/veggies.jpg" alt="" loading="lazy" decoding="async">我这样吃营养均衡吗？</button>
          <button class="chat-quick" data-q="推荐一个 300 kcal 以内的晚餐"><img class="mini-thumb" src="image/dumplings.jpg" alt="" loading="lazy" decoding="async">推荐一个 300 kcal 以内的晚餐</button>
        </div>

        <footer class="footer">
          <div class="container">
            <p><strong>🥗 食鉴 · AI 营养分析师</strong> — AI 健康与生活服务主题参赛作品</p>
            <p class="disclaimer">⚠️ 免责声明：AI 建议仅供参考，不构成医学诊断或治疗建议。</p>
          </div>
        </footer>
      </div>
    </section>
  </main>

  <!-- 右侧圆点指示器 -->
  <nav class="dots" id="dots" aria-label="页面区块导航"></nav>

  <script src="js/ai-api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    Auth.requireLogin();
    Auth.mountNavUser(document.getElementById("nav-user"));
  </script>
  <script src="js/chat.js"></script>
  <script src="js/scroll-ui.js"></script>
  <script src="js/global-ui.js"></script>
</body>
</html>
